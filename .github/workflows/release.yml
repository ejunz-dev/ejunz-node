name: Build and release
on:
  push:
    branches:
      - main

env:
  YARN_ENABLE_IMMUTABLE_INSTALLS: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Corepack
        run: corepack enable
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: yarn
      - name: Build workspace
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: yarn build

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Corepack
        run: corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: yarn
      - name: Build pkg
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: yarn build:pkg
      - name: Get release version and commit
        id: tag
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "version=$(node -p "require('./packages/server/package.json').version")" >> $GITHUB_OUTPUT
          echo "app_name=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT
      - name: Prepare release artifacts
        run: |
          APP="${{ steps.tag.outputs.app_name }}"
          mkdir -p /tmp/release
          cp "dist/${APP}.js" "/tmp/release/${APP}.js"
          if [ -d dist/data ]; then
            [ -d "dist/pkg/${APP}-linux" ] && cp -r dist/data "dist/pkg/${APP}-linux/" || true
            [ -d "dist/pkg/${APP}-macos" ] && cp -r dist/data "dist/pkg/${APP}-macos/" || true
            [ -f "dist/pkg/${APP}-win.exe" ] && mkdir -p dist/pkg-win && cp "dist/pkg/${APP}-win.exe" dist/pkg-win/ && cp -r dist/data dist/pkg-win/ || true
          fi
          if [ -f "dist/pkg/${APP}-win.exe" ]; then
            (cd dist/pkg && zip -r "/tmp/release/${APP}-win.zip" "${APP}-win.exe" data/ 2>/dev/null || zip -r "/tmp/release/${APP}-win.zip" "${APP}-win.exe")
          fi
          if [ -d "dist/pkg/${APP}-macos" ]; then
            tar -czvf "/tmp/release/${APP}-macos.tar.gz" -C dist/pkg "${APP}-macos"
          fi
          if [ -d "dist/pkg/${APP}-linux" ]; then
            tar -czvf "/tmp/release/${APP}-linux.tar.gz" -C dist/pkg "${APP}-linux"
          fi
          ls -la /tmp/release/
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}-${{ steps.tag.outputs.sha_short }}
          files: /tmp/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
