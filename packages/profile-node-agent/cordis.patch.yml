# Independent Agent profile: Mongo persistence plus the in-process API transport.

- id: session-persistence-jsonl
  disabled: true

- id: attachment-local
  config:
    eaHome: !!js process.env.NODE_AGENT_LEGACY_HOME

- id: settings
  disabled: true

- id: credentials
  disabled: true

- insert:
    - id: settings-mongo
      name: '@ejunz/node-agent-profile/settings-mongo'

    - id: credentials-mongo
      name: '@ejunz/node-agent-profile/credentials-mongo'

    - id: edge-host-tools
      name: '@ejunz/node-agent-profile/edge-host-tools'

    - id: tool-host
      name: '@ejunz/ea-core/tool-host'

    - id: storage
      name: '@ejunz/ea-core/storage'

    - id: storage-domain
      name: '@ejunz/ea-core/storage-domain'
      config:
        backend: mongo

    - id: agent-mongo
      name: '@ejunz/node-agent-profile/agent-mongo'

    - id: session-projection-cache
      name: '@ejunz/ea-core/session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    - id: session-stats
      name: '@ejunz/ea-core/session-stats'

    - id: plugin-inventory
      name: '@ejunz/profile-web/host/plugin-inventory'

    - id: api-gateway
      name: '@ejunz/profile-web/host/apiproxy'
      config:
        useDefaultModel: false

    - id: webserver
      name: '@ejunz/profile-web/host/webserver'
      config:
        host: '127.0.0.1'
        port: 0

    - id: web-runtime
      name: '@ejunz/profile-web/app'
      config:
        trustedHosts: []

    - id: connection
      name: '@ejunz/profile-web/client/connection'
      inject: [webRuntime]
      config:
        trustedHosts: !!js ctx.webRuntime.trustedHosts

    - id: api-remotes
      name: '@ejunz/profile-web/api/remotes'
